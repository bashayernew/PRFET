# Herot — single-VPS stack: app + Postgres + Caddy(TLS) + coturn(calls) + LiveKit(meetings).
# Put this file + Caddyfile + livekit.yaml + .env on the server, then: docker compose up -d --build

# Cap the container logs.
#
# Docker's default json-file driver grows WITHOUT LIMIT. On 2026-09-22 that filled the 38 GB
# disk to 100%, which stopped Postgres being able to write, which made the app unreachable
# for the whole day — logs and build cache between them had eaten everything.
#
# 10 MB x 3 files per container is roughly 150 MB worst case across the stack, and still
# leaves plenty of history for `docker compose logs`.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: ..
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    depends_on: [db]
    volumes:
      - uploads:/app/public/uploads     # uploaded media survives restarts
    expose: ["3000"]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: herot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: herot
    volumes:
      - pgdata:/var/lib/postgresql/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOMAIN: ${DOMAIN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  # 1:1 voice/video calls need a TURN server. Host networking = it can use the UDP range.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    command: >
      -n --realm=${DOMAIN} --server-name=${DOMAIN}
      --external-ip=${TURN_EXTERNAL_IP:-63.187.183.253}
      --listening-port=3478 --min-port=49160 --max-port=49200
      --use-auth-secret --static-auth-secret=${TURN_SECRET}
      --no-cli --no-tls --no-dtls --log-file=stdout

  # Group meeting audio (up to 20). Host networking for its media UDP ports.
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml

volumes:
  pgdata: {}
  uploads: {}
  caddy_data: {}
  caddy_config: {}
